{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>
            <i class="bi bi-display"></i> Monitoreo en tiempo real: 
            <strong>{{ alumno.first_name }} {{ alumno.last_name }} ({{ alumno.username }})</strong> 
            <span class="badge bg-secondary ms-2">{{ alumno.ip_local|default:"Sin IP" }}</span>
        </h4>
        <a href="{% url 'educacion:ver_grupos' %}" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Volver a grupos
        </a>
    </div>

    <!-- Contenedor del Visor noVNC -->
    <div class="card shadow-sm">
        <div class="card-body p-0" style="height: 82vh;">
            <iframe 
                src="/static/novnc/vnc.html?host={{ host_servidor }}&port={{ puerto_vnc }}&autoconnect=true&resize=remote&reconnect=true&reconnect_delay=1000&password=Aula6142026" 
                width="100%" 
                height="100%" 
                style="border: none;"
                allowfullscreen>
            </iframe>
        </div>
    </div>
</div>
{% endblock %}
