{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <div class="card border-danger shadow-sm p-4">
        <h3 class="text-danger mb-3"><i class="bi bi-exclamation-triangle me-2"></i>Eliminar Alumno</h3>
        <p>¿Estás seguro de que deseas eliminar al alumno <strong>{{ alumno.get_full_name|default:alumno.username }}</strong>?</p>
        <p class="text-muted small">Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'lista_alumnos' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i> Confirmar Eliminación</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
