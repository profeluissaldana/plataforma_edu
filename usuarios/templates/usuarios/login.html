{% extends 'base.html' %}


{% block title %}

    Iniciar sesión

{% endblock %}


{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-4">

            <h1 class="text-center mb-4">

                Iniciar sesión

            </h1>


            {% if error %}

                <div
                    class="alert alert-danger"
                    role="alert"
                >

                    {{ error }}

                </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}


                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label"
                    >

                        Usuario

                    </label>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label"
                    >

                        Contraseña

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >

                    Ingresar

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
