{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <div class="card shadow-sm p-4">
        <h3 class="mb-3"><i class="bi bi-key me-2"></i>Resetear Contraseña</h3>
        <p class="text-muted">Estás cambiando la contraseña para el alumno <strong>{{ alumno.get_full_name|default:alumno.username }}</strong> ({{ alumno.username }}).</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'lista_alumnos' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-warning"><i class="bi bi-arrow-repeat me-1"></i> Actualizar Clave</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
