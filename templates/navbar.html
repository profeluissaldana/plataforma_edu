{% load static %}

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold ms-3" href="{% url 'inicio' %}">
            <i class="bi bi-mortarboard-fill me-2"></i>Plataforma Educativa
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center me-3">
                {% if user.is_authenticated %}
                    <li class="nav-item me-3 text-light font-monospace small">
                        👋 {{ user.get_full_name|default:user.username }}
                    </li>
                    <li class="nav-item">
                        <!-- Formulario de Logout seguro mediante POST -->
                        <form method="post" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light btn-sm rounded-pill px-3">
                                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
                            </button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="btn btn-light btn-sm rounded-pill px-3" href="{% url 'login' %}">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
